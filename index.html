<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>서브웨이 랜덤 메뉴 뽑기 | RANDOM.ORG</title>
<meta name="description" content="서브웨이 샌드위치 25종 + 빵/치즈/야채/소스까지 random.org 진짜 난수로 뽑아주는 Netlify 웹사이트" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="logo">🥪 SUBWAY<span>RANDOM</span></div>
    <nav>
      <a href="https://www.subway.co.kr/menuList/sandwich" target="_blank" rel="noopener">공식 메뉴판 ↗</a>
      <a href="https://api.random.org/json-rpc/4" target="_blank" rel="noopener">RANDOM.ORG API ↗</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>오늘 뭐 먹지? <br />진짜 난수로 뽑는 서브웨이!</h1>

    <button id="drawBtn" class="btn big" type="button">🎲 랜덤 메뉴 뽑기</button>
    <div id="status" class="status"></div>
  </section>

  <section id="result" class="result hidden" aria-live="polite">
    <div class="card">
      <div class="card-img">
        <span id="rTag" class="tag">SUBPICK</span>
        <img id="rImg" src="" alt="서브웨이 메뉴 이미지" />
      </div>
      <div class="card-body">
        <h2 id="rName">-</h2>
        <p id="rEn" class="en">-</p>
        <p id="rDesc" class="desc">-</p>
        <ul class="spec">
          <li><b>사이즈</b><span id="rSize">-</span></li>
          <li><b>빵</b><span id="rBread">-</span></li>
          <li><b>치즈</b><span id="rCheese">-</span></li>
          <li><b>야채</b><span id="rVeggie">-</span></li>
          <li><b>소스</b><span id="rSauce">-</span></li>
          <li><b>추가토핑</b><span id="rTopping">-</span></li>
          <li><b>굽기</b><span id="rToast">-</span></li>
        </ul>
        <div class="card-actions">
          <button id="redrawBtn" class="btn" type="button">다시 뽑기</button>
          <button id="shareBtn" class="btn ghost" type="button">링크 공유</button>
          <a class="btn ghost" href="https://www.subway.co.kr/menuList/sandwich" target="_blank" rel="noopener">공식 메뉴 확인</a>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="panel">
      <h3>📜 뽑기 기록</h3>
      <ul id="history"></ul>
      <button id="clearHistoryBtn" class="btn ghost small" type="button">기록 지우기</button>
    </div>
  </section>

  <footer>
    <p>🥪 Subway® 이미지는 subway.co.kr 제공 · 난수는 <a href="https://www.random.org/" target="_blank" rel="noopener">RANDOM.ORG</a> 제공 · 개인 프로젝트 (Netlify 호스팅용)</p>
  </footer>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
